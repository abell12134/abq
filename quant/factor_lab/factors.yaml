      5)
    hypothesis: 高开低走是日内多头陷阱的典型特征，频繁出现说明逢高抛压沉重，后续大概率继续走弱，因子值高则预期未来收益为负。
    category: reversal
    status: rejected
    metrics:
      rank_ic: .nan
      icir: .nan
    reject_reason: '表达式无法计算: unsupported operand type(s) for &: ''float'' and ''float'''
    created_iter: 3
    updated_at: 2026-06-15 13:59
  max_return_asymmetry:
