    updated_at: 2026-06-15 13:59
  vol_skew:
    expr: Skew($volume, 20)
    hypothesis: 成交量分布的正偏度表明偶发性的巨量成交，往往反映机构吸筹或出货，未来容易出现方向性行情，偏度极端股预期收益更高。
    category: volume
    status: rejected
    metrics:
      rank_ic: -0.0047
      icir: -0.0607
      oos_rank_ic: -0.0131
      oos_icir: -0.1646
      turnover: 0.2255
