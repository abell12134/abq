account:
  name: live_manual_10k
  # 试运行期：与研究线相同，postclose 按次日开盘价自动模拟成交（无需同花顺人工下单）。
  # 正式接券商实盘时改 mode: manual，并 re-init 账户后改用 record_fills 回填真实成交。
  mode: simulated
  initial_capital: 10000
  target_min_positions: 5
  target_max_positions: 10
  review_min_days: 20

strategy:
  topk: 5
  n_drop: 1
  hold_thresh: 10
  max_weight: 0.2
  min_positions: 5
  max_positions: 10

execution:
  manual_order: false
  simulated_fill: next_open
  use_ump: true
  risk_check: true
  lot_size: 100
  note: "试运行：系统生成订单，postclose 自动按次日开盘价模拟成交；正式实盘再改 manual。"

review:
  benchmark_annual_excess: 0.093
  tracking_deviation_alert: 0.02
  notes:
    - "记录实际成交、费用、现金闲置、未成交/买不满原因。"
    - "满 20 个交易日后再评估跟踪偏差，短样本先验证流程和数据质量。"
