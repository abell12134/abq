account:
  name: live_manual_10k
  # 正式实盘（2026-06-22 切换）：真实资金 12000→20000（2026-08-04 追加注资），
  # 系统出单，次日开盘人工在同花顺下单，收盘后用 record_fills 回填真实成交。
  mode: manual
  initial_capital: 20000
  target_min_positions: 5
  target_max_positions: 10
  review_min_days: 20

strategy:
  topk: 7
  n_drop: 1
  hold_thresh: 10
  max_weight: 0.2
  min_positions: 5
  max_positions: 10

execution:
  manual_order: true
  # 账户无创业板交易权限，买入候选跳过（2026-07-13）；科创板同理
  # （06-23 曾出单 BUY SH688349 未能成交）。若开通权限可删除对应项。
  exclude_boards: [chinext, star]
  simulated_fill: next_open
  use_ump: true
  # 舆情硬伤筛：make_trade_plan 之后用 Cursor Agent 联网检索，否决 BUY 硬伤票；
  # 产出 orders_exec/ + sentiment_checklist_*.md；失败 fail-open。research/shadow 不开。
  use_sentiment_veto: true
  # 舆情长期记忆：东财/财联社/新浪采集 + LLM 摘要 + 本地向量库；看板「舆情跟踪」页展示。
  use_sentiment_memory: true
  # 短线猎手（纯看板建议）：四路候选 → LLM 分档预测（10日内收盘+10%口径）+ 收盘口径跟踪；
  # 共享 data/overlays/swing_hunter/；同日已有成功预测则跳过 LLM（跟踪仍更新）。
  # 不改 orders/、不开账户；看板「短线猎手」页展示。失败 fail-open。
  use_swing_hunter: true
  risk_check: true
  lot_size: 100
  redeploy_residual_cash: true   # 小资金专用：建等权仓后用剩余现金按分数顺位补整手，压低闲置
  note: "正式实盘：系统生成订单，次日开盘人工同花顺下单，收盘后 record_fills 回填真实成交。有舆情筛时优先执行 orders_exec/。"

review:
  benchmark_annual_excess: 0.093
  tracking_deviation_alert: 0.02
  notes:
    - "记录实际成交、费用、现金闲置、未成交/买不满原因。"
    - "满 20 个交易日后再评估跟踪偏差，短样本先验证流程和数据质量。"
