account:
  name: research_sim_100k
  mode: simulated
  initial_capital: 100000
  review_min_days: 20

strategy:
  topk: 50
  n_drop: 3
  hold_thresh: 10
  max_weight: 0.05
  min_positions: 30
  max_positions: 50

execution:
  manual_order: false
  simulated_fill: next_open
  use_ump: true
  # 短线猎手（纯看板建议）：四路候选 → LLM 分档预测；共享 data/overlays/swing_hunter/；
  # 同日已有成功预测则跳过 LLM（跟踪仍更新）。失败 fail-open。
  use_swing_hunter: true
  risk_check: true
  lot_size: 100
  # 等权 floor 取整会留下大量闲置现金；开启后用建仓剩余现金按分数顺位补整手（≤max_weight），
  # 把闲置压到 1 手以内，避免持仓萎缩后现金长期闲置、超额被现金拖累（2026-08 修复）。
  redeploy_residual_cash: true
  note: "研究模拟线：系统按次日开盘价自动模拟成交，并记录收盘净值。"

review:
  benchmark_annual_excess: 0.093
  tracking_deviation_alert: 0.02
  notes:
    - "用于观察每日模拟操作、费用、换手、收盘净值。"
    - "与 live_manual_10k 对比，识别小资金整手/成交偏差/人工执行影响。"
