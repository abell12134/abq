# 全局配置：标的池、路径、费率、风控参数
# 所有模块统一从这里读取，禁止在代码里硬编码

paths:
  qlib_data: ~/.qlib/qlib_data/cn_data      # Qlib bin 数据（唯一真相源）
  csv_raw: ~/project/quant/data/csv_raw      # 抓取的原始 CSV（dump_bin 输入）
  signals: ~/project/quant/data/signals
  target_position: ~/project/quant/data/target_position
  orders: ~/project/quant/data/orders
  fills: ~/project/quant/data/fills
  nav: ~/project/quant/data/nav
  reports: ~/project/quant/data/reports

universe:
  market: csi500            # 中证500：中小盘定价效率更低，量价因子超额更显著
  benchmark: SH000905       # 基准指数（中证500）

strategy:
  topk: 50                  # 持仓数量（与 research/workflow_baseline.yaml 保持一致）
  n_drop: 3                 # 每日最多换仓数量（控制换手率）
  hold_thresh: 10           # 最小持有天数：5 日标签下强制低换手，压低成本拖累
  max_weight: 0.05          # 单票权重上限

costs:                      # 与券商实际费率核对后修改
  commission: 0.00025       # 佣金 万2.5
  min_commission: 5         # 最低 5 元
  stamp_duty_sell: 0.0005   # 卖出印花税 0.05%
  slippage: 0.001           # 滑点基准 0.1%

data_quality:
  max_abs_return: 0.21      # 单日涨跌幅绝对值上限（主板 ±10%/创业板 ±20% + 容差）
  min_price: 0.01
  max_missing_ratio: 0.02   # 单日缺失股票比例上限，超过则阻断

risk:
  daily_loss_halt: 0.03     # 单日亏损 3% 熔断
  position_deviation_alert: 0.02
