# 基线策略：Alpha158 因子 + LightGBM，全 A（instruments=all）选股，TopK 组合
# - 由 csi500 切换为 all：覆盖沪深京全部可交易股票（含历史退市区间）
# - 基准改中证全指 SH000985（与全 A 宇宙匹配；原 csi500 版见 workflow_baseline_csi500.yaml）
# - 标签用 5 日开盘价收益；低换手 hold_thresh=10
# 时间切分：训练 2010-2021 / 验证 2022-2023 / 测试(样本外回测) 2024 至今
# 可用 qrun 直接运行，也被 run_baseline.py 读取
#
# 注意：全 A 特征/训练内存与耗时远高于 csi500（建议 ≥8G 内存或充足 swap）

qlib_init:
  # clone 后由 ensure_qlib_data 从 datasets/*.part_* 解压；也可手动指到 ~/.qlib/...
  provider_uri: "datasets/qlib_data/cn_data"
  region: cn

market: &market all
benchmark: &benchmark SH000985

data_handler_config: &data_handler_config
  start_time: 2010-01-01
  end_time: 2026-07-16
  fit_start_time: 2010-01-01
  fit_end_time: 2021-12-31
  instruments: *market

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 3
      hold_thresh: 10
  backtest:
    start_time: 2024-01-01
    end_time: 2026-07-16
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: open
      open_cost: 0.0015
      close_cost: 0.002
      min_cost: 5

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 2
      early_stopping_rounds: 50
      num_boost_round: 1000
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158PlusLab
        module_path: alpha158_plus_lab
        kwargs:
          <<: *data_handler_config
          label: [["Ref($open, -6) / Ref($open, -1) - 1"], ["LABEL0"]]
      segments:
        train: [2010-01-01, 2021-12-31]
        valid: [2022-01-01, 2023-12-31]
        test: [2024-01-01, 2026-07-16]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
