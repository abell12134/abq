# 基线策略：Alpha158 因子 + LightGBM，中证500 内选股，TopK 组合
# - 选 csi500 而非 csi300：中小盘定价效率更低，量价类因子超额更显著
# - 标签用 5 日开盘价收益：1 日标签的阿尔法衰减太快，高换手时被交易成本吃光
#   （实测：1日标签毛超额 +6.7% / 净 -1.4%）；5 日标签信号衰减慢，可低换手持有
# 时间切分：训练 2010-2021 / 验证 2022-2023 / 测试(样本外回测) 2024 至今
# 可用 qrun 直接运行，也被 run_baseline.py 读取

qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn

market: &market csi500
benchmark: &benchmark SH000905

data_handler_config: &data_handler_config
  start_time: 2010-01-01
  end_time: 2026-06-11
  fit_start_time: 2010-01-01
  fit_end_time: 2021-12-31
  instruments: *market

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
      signal: <PRED>
      topk: 50            # 持仓 50 只，分散个股风险，等权约 2% 单票
      n_drop: 3           # 每日最多换 3 只，控制换手
      hold_thresh: 10     # 最小持有 10 日：标签为 5 日收益，强制低换手把成本压下来
                          # （实测：hold_thresh 由 1→10，净 IR 由 -0.17 升至 1.04）
  backtest:
    start_time: 2024-01-01
    end_time: 2026-06-11
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095        # 涨跌停约束
      deal_price: open              # 次日开盘价成交（信号 T 日生成，T+1 执行）
      open_cost: 0.0015             # 买入：佣金+滑点
      close_cost: 0.002             # 卖出：佣金+印花税+滑点
      min_cost: 5

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 2
      early_stopping_rounds: 50
      num_boost_round: 1000
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        # Alpha158PlusLab：无 live 因子时 ≡ Alpha158；因子晋升后重训即带上新特征
        class: Alpha158PlusLab
        module_path: alpha158_plus_lab
        kwargs:
          <<: *data_handler_config
          label: [["Ref($open, -6) / Ref($open, -1) - 1"], ["LABEL0"]]
      segments:
        train: [2010-01-01, 2021-12-31]
        valid: [2022-01-01, 2023-12-31]
        test: [2024-01-01, 2026-06-11]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
